*{box-sizing:border-box}html{scroll-behavior:smooth}
body{margin:0;color:var(--ink);background:var(--bg);font:16px/1.62 "Helvetica Neue",Helvetica,Arial,"Segoe UI",system-ui,sans-serif;overflow-x:clip;-webkit-font-smoothing:antialiased}
.l-en{display:none}html[lang=en] .l-en{display:inline}html[lang=en] .l-vi{display:none}
#top{position:fixed;inset:0 0 auto 0;height:var(--hh);z-index:40;display:flex;align-items:center;gap:16px;padding:0 22px;background:var(--bg);border-bottom:1.5px solid var(--ink)}
.brand{display:flex;align-items:center;gap:10px;font:800 15px/1 "Helvetica Neue",Arial,sans-serif;letter-spacing:-.01em;text-transform:uppercase;white-space:nowrap}
.brand i{width:14px;height:14px;background:var(--ac);display:inline-block;transition:background 1s}

.tg{display:flex;align-items:center;gap:8px;margin-left:auto}

S({ch:0,sc:'hero',hero:1,k:['Khoá luận tốt nghiệp','Graduation thesis'],t:['Điều gì quyết định biên lãi của ngân hàng?','What decides a bank\'s interest margin?'],
 p:[['Mỗi ô vuông là một quan sát: một ngân hàng trong một năm. Có 27 ngân hàng thương mại cổ phần Việt Nam, 11 năm từ 2013 đến 2023, tổng cộng 297 ô. Màu càng đỏ, biên lãi (NIM) càng cao.','Each square is one observation: one bank in one year. There are 27 Vietnamese joint-stock commercial banks over 11 years, 2013 to 2023, 297 squares in all. The redder, the higher the net interest margin (NIM).'],
  ['Cuộn xuống để đi qua cả khoá luận, từ lý do chọn đề tài đến kết luận. Đồng hồ trên đầu trang đếm năm theo tiến độ đọc.','Scroll down to follow the whole thesis, from the rationale to the conclusion. The clock at the top counts years as you read.']],
 au:['Khoá luận về các yếu tố ảnh hưởng đến NIM · Việt Nam 2013–2023','Thesis on the determinants of NIM · Vietnam 2013–2023'],cue:1});
S({ch:0,sc:'hist',k:['Lý do chọn đề tài','Why this topic'],t:['NIM đo khả năng sinh lời từ tín dụng','NIM measures how profitable lending is'],
 p:[['Ngân hàng thương mại là trụ cột của kinh tế Việt Nam: huy động vốn rồi phân bổ để thúc đẩy tăng trưởng và giữ ổn định vĩ mô. NIM là chỉ số then chốt vì vừa cho thấy khả năng tạo lợi nhuận từ tín dụng, vừa phản ánh hiệu quả quản lý chi phí huy động.','Commercial banks are a pillar of the Vietnamese economy: they raise funds and allocate them to support growth and macro stability. NIM is a key indicator because it shows both how well credit generates profit and how efficiently funding costs are managed.'],
  ['Trong 297 quan sát, NIM trung bình là 3,08%, nhưng trải dài từ 0,59% đến 9,33%. Sự chênh lệch lớn này chính là câu hỏi cần giải thích.','Across the 297 observations NIM averages 3.08% but ranges from 0.59% to 9.33%. That wide spread is the question to explain.']],
 take:['Biên lãi trung bình 3,08%, nhưng ngân hàng này gấp hơn mười lần ngân hàng kia.','Average margin 3.08%, yet one observation is over ten times another.']});
S({ch:0,sc:'strip',k:['Lý do · diễn biến','Rationale · trend'],t:['Biên lãi của ngành dao động theo thời gian','The sector margin moves over time'],
 p:[['Trung bình ngành đi từ 2,96% năm 2013, xuống đáy 2,75% năm 2014 rồi leo dần lên đỉnh 3,55% năm 2022, trước khi giảm về 3,15% năm 2023. Áp lực nợ xấu từ bất động sản và sản xuất có thể tiếp tục kéo NIM xuống.','The sector average goes from 2.96% in 2013, dips to 2.75% in 2014, then climbs to a peak of 3.55% in 2022 before easing to 3.15% in 2023. Bad-debt pressure from real estate and manufacturing may keep dragging NIM down.'],
  ['Hiểu các yếu tố đứng sau những dao động này giúp ngân hàng đưa ra quyết định đúng và giúp nhà quản lý có cơ sở khoa học cho chính sách.','Understanding what lies behind these swings helps banks decide well and gives regulators a scientific basis for policy.']]});
S({ch:0,sc:'factors',k:['Mục tiêu · câu hỏi','Aims · questions'],t:['Tám yếu tố, ba câu hỏi nghiên cứu','Eight factors, three research questions'],
 p:[['Mục tiêu tổng quát: nghiên cứu các yếu tố ảnh hưởng đến NIM của ngành ngân hàng thương mại Việt Nam giai đoạn 2013–2023. Có bốn yếu tố nội tại (CAR, CAP, LDR, NPL), ba yếu tố vĩ mô (tỷ giá, lạm phát, tăng trưởng GDP) và một cú sốc bất ngờ là đại dịch COVID-19.','General aim: study the factors affecting NIM of Vietnamese commercial banks in 2013–2023. Four are internal (CAR, CAP, LDR, NPL), three are macro (exchange rate, inflation, GDP growth) and one is an unexpected shock, the COVID-19 pandemic.'],
  ['Ba câu hỏi: yếu tố nào ảnh hưởng đến NIM? Mức độ tác động ra sao? Hàm ý chính sách là gì?','Three questions: which factors affect NIM? How strongly? What are the policy implications?']]});
S({ch:0,sc:'skyline',k:['Đối tượng · phạm vi','Subject · scope'],t:['27 ngân hàng, mười một năm, một bảng dữ liệu','27 banks, eleven years, one panel'],
 p:[['Mẫu gồm 27 ngân hàng thương mại cổ phần trong 33 ngân hàng hiện nay, các ngân hàng nước ngoài và liên doanh bị loại. Mỗi cột là một ngân hàng, mỗi lớp là một năm: chiều cao cột là tổng NIM mười một năm.','The sample has 27 of the 33 joint-stock commercial banks; foreign and joint-venture banks are excluded. Each column is a bank, each layer a year: column height is the sum of its eleven NIM values.'],
  ['Chênh lệch giữa các ngân hàng rất lớn: VPB trung bình 7,12% còn VBB chỉ 1,65%. Phương pháp là hồi quy dữ liệu bảng, mô hình nào phù hợp sẽ do kiểm định quyết định.','The gap between banks is large: VPB averages 7.12% while VBB manages only 1.65%. The method is panel regression, with tests deciding which model fits.']]});
S({ch:0,sc:'clusters',st:{set:'struct'},k:['Bố cục','Structure'],t:['Khoá luận đi qua sáu trạm','The thesis passes six stops'],
 p:[['Phần mở đầu nêu lý do và phương pháp. Chương 1 giới thiệu VietinBank. Chương 2 trình bày cơ sở lý thuyết và tổng quan nghiên cứu. Chương 3 đề xuất mô hình, biến và dữ liệu. Chương 4 là kết quả và thảo luận. Phần kết luận đưa ra hàm ý chính sách, hạn chế và hướng đi tiếp.','The opening states the rationale and method. Chapter 1 introduces VietinBank. Chapter 2 sets out theory and literature. Chapter 3 proposes the model, variables and data. Chapter 4 reports results and discussion. The conclusion gives policy implications, limitations and next steps.']]});
/* ---- Chương 1: VietinBank ---- */
S({ch:1,sc:'ctg',k:['1.1 · Giới thiệu chung','1.1 · Overview'],t:['VietinBank, mã CTG, trong nhóm 27 ngân hàng','VietinBank, ticker CTG, among the 27 banks'],
 p:[['Ngân hàng TMCP Công Thương Việt Nam được thành lập ngày 26/3/1988 trên cơ sở tách ra từ Ngân hàng Nhà nước, niêm yết trên HOSE từ 16/7/2009. Vốn điều lệ hơn 53,7 nghìn tỷ đồng, hội sở tại 108 Trần Hưng Đạo, Hà Nội.','Vietnam Joint Stock Commercial Bank for Industry and Trade was founded on 26 March 1988 as a split from the State Bank and listed on HOSE on 16 July 2009. Charter capital exceeds VND 53.7 trillion, headquartered at 108 Tran Hung Dao, Hanoi.'],
  ['Trong mẫu, NIM trung bình của CTG là 2,86%, xếp thứ 13 trên 27 và thấp hơn mức trung bình 3,08% của cả nhóm. Đường đỏ là CTG, đường nét đứt là trung bình 27 ngân hàng.','In the sample CTG averages a NIM of 2.86%, 13th of 27 and below the 3.08% group mean. The red line is CTG, the dashed line the 27-bank average.']],
 take:['Một ngân hàng quốc doanh lớn, nhưng biên lãi chỉ ở mức trung bình ngành.','A large state-led bank, yet its margin sits around the sector middle.']});
S({ch:1,sc:'clusters',st:{set:'vtb'},k:['1.1 · Hoạt động chính','1.1 · Main activities'],t:['Mạng lưới rộng và định hướng an toàn, hiệu quả, bền vững','A wide network and a safe, efficient, sustainable stance'],
 p:[['VietinBank huy động và nhận tiền gửi, cho vay, thanh toán, giao dịch ngoại tệ và tài trợ thương mại. Ngân hàng đã nhiều năm liền được vinh danh là ngân hàng SME, bán lẻ và dịch vụ ngoại hối tốt nhất Việt Nam.','VietinBank takes deposits, lends, handles payments, foreign-exchange and trade finance. It has been named Vietnam\'s best SME, retail and FX bank for several consecutive years.']]});
S({ch:1,sc:'phases',k:['1.2 · Lịch sử phát triển','1.2 · History'],t:['Ba giai đoạn: kiến tạo, kiện toàn, chuyển đổi','Three stages: foundation, consolidation, transformation'],
 p:[['Giai đoạn 1988–2013 là kiến tạo hệ thống nền tảng, với dấu mốc niêm yết 2009 và đối tác chiến lược nước ngoài. Giai đoạn 2013–2020 là kiện toàn: nâng quản trị, tối ưu mô hình hoạt động, củng cố tài chính. Từ 2021 là chuyển đổi toàn diện bằng công nghệ số.','1988–2013 built the foundations, with the 2009 listing and a foreign strategic partner. 2013–2020 was consolidation: better governance, an optimised operating model and a stronger balance sheet. From 2021 comes full transformation through digital technology.'],
  ['Cũng chính khoảng 2013–2023 là giai đoạn mà dữ liệu của khoá luận bao phủ.','The 2013–2023 window is also exactly the period the thesis data covers.']]});
/* ---- Chương 2: lý thuyết ---- */
S({ch:2,sc:'flow',k:['2.1 · Ngân hàng thương mại','2.1 · Commercial banks'],t:['Ngân hàng sống nhờ khoảng chênh giữa lãi thu và lãi trả','A bank lives off the gap between interest earned and paid'],
 p:[['Ngân hàng thương mại làm ba việc chính: huy động vốn từ tiền gửi, sử dụng vốn để cho vay và đầu tư, và làm trung gian thanh toán thu hoa hồng. Hai việc đầu tạo ra thu nhập lãi: lãi cho vay trừ đi lãi phải trả người gửi.','A commercial bank does three main things: it raises funds from deposits, deploys them in loans and investments, and acts as a payment intermediary earning commissions. The first two create net interest income: loan interest minus interest paid to depositors.'],
  ['NIM chia thu nhập lãi thuần cho tài sản sinh lãi bình quân, nên so sánh được giữa ngân hàng lớn và nhỏ.','NIM divides net interest income by average earning assets, so large and small banks can be compared.']],
 eq:['NIM_{it}=\\dfrac{\\text{Thu nhập lãi thuần}_{it}}{\\text{Tài sản sinh lãi bình quân}_{it}}\\times 100\\%'],take:['NIM cao nghĩa là mỗi đồng tài sản sinh lãi mang về nhiều lãi ròng hơn.','A high NIM means every dong of earning assets brings in more net interest.']});
S({ch:2,sc:'factors',k:['2.3 · Yếu tố ảnh hưởng','2.3 · Determinants'],t:['Nội tại, vĩ mô và cú sốc','Internal, macro and shock'],
 p:[['Lý thuyết chia các yếu tố ảnh hưởng đến NIM thành nhóm nội tại (an toàn vốn, quy mô vốn chủ sở hữu, tỷ lệ cho vay trên tiền gửi, nợ xấu), nhóm vĩ mô (tỷ giá, lạm phát, tăng trưởng GDP) và nhóm bất ngờ (đại dịch COVID-19).','Theory groups the determinants of NIM into internal factors (capital adequacy, equity size, loan-to-deposit ratio, bad debt), macro factors (exchange rate, inflation, GDP growth) and an unexpected factor (the COVID-19 pandemic).']]});
S({ch:2,sc:'hyp',k:['Giả thuyết','Hypotheses'],t:['Tám giả thuyết với dấu kỳ vọng','Eight hypotheses with expected signs'],
 p:[['Từ lý thuyết, khoá luận đặt tám giả thuyết. Quy mô vốn và tỷ lệ cho vay trên tiền gửi kỳ vọng cùng chiều với NIM. Nợ xấu và tỷ giá kỳ vọng ngược chiều. An toàn vốn, lạm phát và tăng trưởng GDP có thể tác động theo cả hai hướng. COVID-19 kỳ vọng làm NIM giảm.','Theory yields eight hypotheses. Equity size and loan-to-deposit ratio are expected to move with NIM. Bad debt and the exchange rate are expected to move against it. Capital adequacy, inflation and GDP growth could go either way. COVID-19 is expected to lower NIM.']]});
S({ch:2,sc:'lit',k:['Tổng quan nghiên cứu','Literature'],t:['Mẫu lớn hơn, giai đoạn mới hơn','A larger sample and a more recent window'],
 p:[['Các nghiên cứu trước đều dùng Pooled OLS, FEM, REM và FGLS cho NIM. Bùi Thanh Đan và cộng sự (2023) xét 25 ngân hàng Việt Nam giai đoạn 2012–2021; Rami Obeid (2024) xét 18 ngân hàng ở sáu nền kinh tế Ả Rập giai đoạn 2015–2020. Ngoài ra còn các nghiên cứu ở Indonesia, Nepal, Kenya, Ethiopia và nhiều nơi khác.','Earlier studies also use Pooled OLS, FEM, REM and FGLS for NIM. Bùi Thanh Đan and co-authors (2023) cover 25 Vietnamese banks over 2012–2021; Rami Obeid (2024) covers 18 banks in six Arab economies over 2015–2020. Others look at Indonesia, Nepal, Kenya, Ethiopia and beyond.'],
  ['Khoảng trống: chưa có nghiên cứu nào bao phủ đủ cả giai đoạn trước, trong và sau đại dịch với 27 ngân hàng Việt Nam.','The gap: none covers the periods before, during and after the pandemic for 27 Vietnamese banks.']]});
/* ---- Chương 3: phương pháp ---- */
S({ch:3,sc:'panel',k:['3.1 · Dữ liệu bảng','3.1 · Panel data'],t:['Dữ liệu bảng: nhiều ngân hàng, nhiều năm','Panel data: many banks, many years'],
 p:[['Dữ liệu bảng kết hợp chiều không gian (27 ngân hàng) và chiều thời gian (11 năm). Một dòng là chuỗi thời gian của một ngân hàng; một hàng là lát cắt ngang của cả nhóm tại một năm. Dùng cả hai chiều cho nhiều thông tin hơn và ít cộng tuyến hơn.','Panel data combines a cross-section (27 banks) with a time dimension (11 years). One column is a bank\'s time series; one row is a cross-section of the whole group in a year. Using both dimensions gives more information and less collinearity.'],
  ['Số liệu lấy từ báo cáo tài chính của các ngân hàng, từ Tổng cục Thống kê và nguồn dữ liệu kinh tế vĩ mô.','Data come from the banks\' financial statements, the General Statistics Office and macroeconomic data sources.']],
 eq:['\\begin{aligned}NIM_{it}={}&\\beta_0+\\beta_1CAR_{it}+\\beta_2CAP_{it}+\\beta_3LDR_{it}+\\beta_4NPL_{it}\\\\&+\\beta_5ER_t+\\beta_6INF_t+\\beta_7GDP_t+\\beta_8COVID_t+\\varepsilon_{it}\\end{aligned}']});
S({ch:3,sc:'vars',st:{v:'nim'},k:['3.2 · Biến phụ thuộc','3.2 · Dependent variable'],t:['NIM là biến cần giải thích','NIM is the variable to explain'],
 p:[['Bấm các nút để xem từng biến trải trên cùng ma trận ngân hàng × năm. Bắt đầu với NIM: màu đỏ đậm tập trung ở vài ngân hàng như VPB, MBB, TCB, trong khi nhiều ngân hàng nhà nước nhạt màu quanh năm.','Use the buttons to see each variable on the same bank × year matrix. Start with NIM: deep red concentrates in a few banks such as VPB, MBB and TCB, while many state banks stay pale year after year.']]});
S({ch:3,sc:'vars',st:{v:'cap'},k:['3.2 · Biến nội tại','3.2 · Internal variables'],t:['Bốn biến đo sức khoẻ riêng của ngân hàng','Four variables for the bank\'s own health'],
 p:[['An toàn vốn đo vốn tự có so với tài sản có điều chỉnh rủi ro. Quy mô vốn chủ sở hữu là vốn chủ trên tổng tài sản. Cho vay trên tiền gửi cho biết bao nhiêu tiền gửi đã được đưa vào tín dụng. Nợ xấu là phần dư nợ khó thu hồi.','Capital adequacy relates own capital to risk-weighted assets. Equity size is equity over total assets. Loan-to-deposit shows how much of deposits is lent out. Bad debt is the share of loans that are hard to recover.']],
 eq:['CAR=\\dfrac{\\text{Vốn tự có}}{\\text{Tài sản có rủi ro}},\\quad CAP=\\dfrac{\\text{Vốn chủ sở hữu}}{\\text{Tổng tài sản}}','LDR=\\dfrac{\\text{Dư nợ cho vay}}{\\text{Tổng tiền gửi}}\\times100\\%,\\quad NPL=\\dfrac{\\text{Nợ xấu}}{\\text{Tổng dư nợ}}']});
S({ch:3,sc:'vars',st:{v:'er'},k:['3.2 · Biến vĩ mô','3.2 · Macro variables'],t:['Ba biến vĩ mô và một cú sốc chung','Three macro variables and one common shock'],
 p:[['Tỷ giá USD/VND, lạm phát và tăng trưởng GDP chỉ đổi theo năm, không đổi theo ngân hàng, nên mỗi hàng của ma trận cùng một màu. Biến COVID-19 nhận giá trị 1 trong các năm 2020, 2021, 2022 và 0 ở các năm còn lại.','The USD/VND rate, inflation and GDP growth vary by year but not by bank, so every row of the matrix has one colour. The COVID-19 variable equals 1 in 2020, 2021 and 2022 and 0 in all other years.']],
 eq:['INF_t=\\dfrac{CPI_t-CPI_{t-1}}{CPI_{t-1}}\\times100\\%,\\quad GDP_t=\\dfrac{GDP_t-GDP_{t-1}}{GDP_{t-1}}\\times100\\%']});
S({ch:3,sc:'models',k:['3.4 · Mô hình','3.4 · Models'],t:['Pooled OLS, FEM, REM: ba cách nhìn dữ liệu bảng','Pooled OLS, FEM, REM: three views of panel data'],
 p:[['Pooled OLS coi mọi ngân hàng giống nhau và vẽ một đường duy nhất. FEM cho mỗi ngân hàng một hệ số chặn riêng để hấp thụ các đặc điểm không đổi theo thời gian. REM coi các hệ số chặn đó là ngẫu nhiên và không tương quan với biến giải thích. Hình chỉ minh hoạ bằng một biến (CAP).','Pooled OLS treats all banks alike and fits one line. FEM gives each bank its own intercept to absorb time-invariant traits. REM treats those intercepts as random and uncorrelated with the regressors. The picture illustrates with one variable (CAP) only.']],
 eq:['\\text{FEM: } NIM_{it}=\\alpha_i+\\mathbf{x}_{it}\'\\boldsymbol\\beta+\\varepsilon_{it}','\\text{REM: } NIM_{it}=\\beta_0+\\mathbf{x}_{it}\'\\boldsymbol\\beta+u_i+\\varepsilon_{it},\\ u_i\\sim(0,\\sigma_u^2)']});
S({ch:3,sc:'tests',k:['3.4 · Chọn mô hình','3.4 · Model selection'],t:['Quy trình kiểm định','The testing sequence'],
 p:[['Kiểm định F chọn giữa Pooled OLS và FEM. Breusch–Pagan LM chọn giữa Pooled OLS và REM. Hausman chọn giữa FEM và REM. Sau đó mô hình được kiểm tra đa cộng tuyến bằng VIF, phương sai sai số thay đổi bằng kiểm định Wald và tự tương quan bằng kiểm định Wooldridge. Nếu có vi phạm, dùng FGLS.','The F-test picks between Pooled OLS and FEM. Breusch–Pagan LM picks between Pooled OLS and REM. Hausman picks between FEM and REM. The chosen model is then checked for multicollinearity with VIF, heteroskedasticity with a Wald test and autocorrelation with the Wooldridge test. If violated, FGLS is used.'],
  ['Ở đây đồ thị cho thấy kết quả thực tế của từng kiểm định: thanh càng ngắn, p-value càng nhỏ.','The chart already shows each test\'s actual result: the shorter the bar, the smaller the p-value.']],
 eq:['H=(\\hat{\\boldsymbol\\beta}_{FE}-\\hat{\\boldsymbol\\beta}_{RE})\'\\big[\\mathrm{Var}(\\hat{\\boldsymbol\\beta}_{FE})-\\mathrm{Var}(\\hat{\\boldsymbol\\beta}_{RE})\\big]^{-1}(\\hat{\\boldsymbol\\beta}_{FE}-\\hat{\\boldsymbol\\beta}_{RE})\\sim\\chi^2_k','VIF_j=\\dfrac{1}{1-R_j^2}']});
/* ---- Chương 4: kết quả ---- */
S({ch:4,sc:'desc',st:{v:'nim'},k:['4.1 · Thống kê mô tả','4.1 · Descriptive statistics'],t:['NIM trung bình 3,08%, độ lệch chuẩn 1,28','Mean NIM 3.08%, standard deviation 1.28'],
 p:[['Chọn từng biến để xem giá trị theo năm và bảng so sánh giữa các giai đoạn. NIM trung bình của năm COVID là 3,32% so với 2,99% các năm còn lại. An toàn vốn trung bình 12,38%, quy mô vốn chủ 8,72%, cho vay trên tiền gửi 88,94%, nợ xấu 2,17%.','Pick a variable to see its yearly values and a comparison across periods. Mean NIM in COVID years is 3.32% against 2.99% in other years. Capital adequacy averages 12.38%, equity size 8.72%, loan-to-deposit 88.94% and bad debt 2.17%.'],
  ['Nợ xấu có ngoại lệ đến 29,76% ở một ngân hàng trong một năm, còn cho vay trên tiền gửi có lúc vượt 142%.','Bad debt has an outlier of 29.76% for one bank in one year, and loan-to-deposit tops 142% at times.']]});
S({ch:4,sc:'corr',st:{p:'all'},k:['4.1 · Tương quan','4.1 · Correlation'],t:['LDR và CAP gắn với NIM mạnh nhất','LDR and CAP link most strongly with NIM'],
 p:[['Ma trận tương quan cho thấy NIM đồng biến mạnh nhất với cho vay trên tiền gửi (0,50) và quy mô vốn chủ (0,42), yếu hơn với an toàn vốn (0,22). Các cặp biến độc lập hiếm khi vượt 0,6, trừ CAR và CAP (0,65), điều này báo hiệu rủi ro đa cộng tuyến thấp.','The correlation matrix shows NIM moves most with loan-to-deposit (0.50) and equity size (0.42), less with capital adequacy (0.22). Pairs of regressors seldom exceed 0.6, except CAR and CAP (0.65), which signals a low risk of multicollinearity.']]});
S({ch:4,sc:'scatter',st:{v:'cap'},k:['4.1 · CAP','4.1 · CAP'],t:['Vốn chủ sở hữu càng dày, biên lãi càng cao','The thicker the equity, the higher the margin'],
 p:[['Mỗi chấm là một quan sát; đường đen là đường hồi quy đơn biến. Khi vốn chủ sở hữu trên tổng tài sản tăng, NIM có xu hướng tăng. Lý do: nhiều vốn tự có thì ít phụ thuộc vào vốn vay đắt, nên giữ lại được nhiều lãi hơn.','Each dot is an observation; the black line is a one-variable regression. As equity over total assets rises, NIM tends to rise. A bank with more own capital relies less on costly borrowing and keeps more of the interest it earns.']]});
S({ch:4,sc:'scatter',st:{v:'ldr'},k:['4.1 · LDR','4.1 · LDR'],t:['Cho vay nhiều hơn trên mỗi đồng tiền gửi','Lending more for each dong of deposits'],
 p:[['Đây là quan hệ đồng biến rõ nhất. Ngân hàng đưa tỷ lệ tiền gửi vào tín dụng càng cao thì thu lãi càng lớn, miễn là giữ được thanh khoản.','This is the clearest positive link. The more of its deposits a bank turns into loans, the more interest it earns, provided it keeps liquidity.']]});
S({ch:4,sc:'scatter',st:{v:'npl'},k:['4.1 · NPL','4.1 · NPL'],t:['Nợ xấu bào mòn thu nhập lãi','Bad debt eats into interest income'],
 p:[['Nợ xấu không sinh lãi và buộc ngân hàng trích dự phòng. Trong đồ thị đơn biến quan hệ yếu vì còn nhiều yếu tố khác lẫn vào; khi kiểm soát chúng bằng hồi quy, tác động âm hiện rõ.','Bad debt earns no interest and forces provisions. The one-variable chart looks weak because many other factors mix in; once they are controlled in the regression, the negative effect shows clearly.']]});
S({ch:4,sc:'forest',st:{m:'po'},k:['4.1 · Ba mô hình','4.1 · Three models'],t:['Pooled OLS, FEM, REM cho cùng một bức tranh','Pooled OLS, FEM and REM paint one picture'],
 p:[['Bấm các nút để đổi mô hình. Trong cả ba, quy mô vốn chủ (CAP) và cho vay trên tiền gửi (LDR) có hệ số dương, có ý nghĩa ở mức 1%. Nợ xấu có hệ số âm, có ý nghĩa ở FEM và REM. An toàn vốn, tỷ giá, lạm phát và GDP chưa có ý nghĩa ở mức 5%.','Use the buttons to switch model. In all three, equity size (CAP) and loan-to-deposit (LDR) have positive coefficients significant at 1%. Bad debt is negative and significant in FEM and REM. Capital adequacy, exchange rate, inflation and GDP are not significant at 5%.'],
  ['Hệ số COVID dương, khoảng 0,18–0,19 trong FEM và REM, có ý nghĩa ở mức 10%.','The COVID coefficient is positive, about 0.18–0.19 in FEM and REM, significant at 10%.']]});
S({ch:4,sc:'tests',k:['4.1 · Kết quả kiểm định','4.1 · Test results'],t:['REM thắng, nhưng còn hai vi phạm','REM wins, but two violations remain'],
 p:[['Kiểm định F và Breusch–Pagan đều bác bỏ Pooled OLS (p < 0,0001). Hausman có p = 0,697 nên không bác bỏ giả thuyết hiệu ứng ngẫu nhiên: chọn REM. Mean VIF 1,59 dưới 2, không có đa cộng tuyến đáng kể.','The F and Breusch–Pagan tests both reject Pooled OLS (p < 0.0001). Hausman gives p = 0.697 so random effects are not rejected: choose REM. Mean VIF of 1.59 is below 2, so there is no serious multicollinearity.'],
  ['Tuy vậy kiểm định Wald cho thấy phương sai sai số thay đổi (p < 0,0001) và kiểm định Wooldridge cho thấy tự tương quan (p = 0,0009). Cần FGLS để sửa.','However the Wald test finds heteroskedasticity (p < 0.0001) and the Wooldridge test finds autocorrelation (p = 0.0009). FGLS is needed to correct them.']]});
S({ch:4,sc:'forest',st:{m:'fg'},k:['4.1 · FGLS','4.1 · FGLS'],t:['FGLS: mô hình cuối cùng','FGLS: the final model'],
 p:[['FGLS cho phép phương sai khác nhau giữa các ngân hàng và tự tương quan bậc một trong chuỗi, rồi ước lượng lại bằng bình phương tối thiểu có trọng số. Sau khi sửa, năm biến có ý nghĩa: CAP, LDR và GDP dương; NPL âm; COVID dương. CAR, tỷ giá và lạm phát vẫn không có ý nghĩa.','FGLS allows variances to differ across banks and first-order autocorrelation within them, then re-estimates by weighted least squares. After the fix five variables are significant: CAP, LDR and GDP positive; NPL negative; COVID positive. CAR, exchange rate and inflation remain insignificant.']],
 eq:['\\hat{\\boldsymbol\\beta}_{FGLS}=\\big(X\'\\hat\\Omega^{-1}X\\big)^{-1}X\'\\hat\\Omega^{-1}y']});
S({ch:4,sc:'rank',k:['4.2 · Thảo luận','4.2 · Discussion'],t:['Yếu tố nào mạnh nhất?','Which factor matters most?'],
 p:[['Để so sánh mức độ ảnh hưởng, hệ số được chuẩn hoá bằng độ lệch chuẩn. Quy mô vốn chủ sở hữu mạnh nhất (β* ≈ 0,27), rồi cho vay trên tiền gửi (0,17) và nợ xấu (−0,10); COVID (0,07) và GDP (0,05) nhỏ hơn; CAR và tỷ giá nhỏ và không có ý nghĩa, lạm phát gần bằng không.','To compare magnitudes the coefficients are standardised by standard deviations. Equity size is strongest (β* ≈ 0.27), then loan-to-deposit (0.17) and bad debt (−0.10); COVID (0.07) and GDP (0.05) are smaller; CAR and the exchange rate are small and insignificant, inflation is near zero.']],
 eq:['\\beta^*_k=\\hat\\beta_k\\,\\dfrac{\\sigma_{x_k}}{\\sigma_{NIM}}']});
S({ch:4,sc:'verdict',k:['4.2 · Kiểm tra giả thuyết','4.2 · Hypotheses tested'],t:['Bốn giả thuyết đứng vững, hai không có ý nghĩa, hai bị bác bỏ','Four hypotheses hold, two are insignificant, two are rejected'],
 p:[['CAP, LDR và NPL đúng như kỳ vọng. GDP có tác động dương, nằm trong khoảng kỳ vọng hai chiều. CAR và lạm phát không có ý nghĩa, giống một số nghiên cứu ở Indonesia, Nepal và Việt Nam. Tỷ giá không có ý nghĩa nên không ủng hộ kỳ vọng ngược chiều.','CAP, LDR and NPL behave as expected. GDP has a positive effect, within the two-sided expectation. CAR and inflation are insignificant, as in studies from Indonesia, Nepal and Vietnam. The exchange rate is insignificant, so the expected negative link is not supported.'],
  ['COVID có hệ số dương, trái với kỳ vọng ngược chiều: giả thuyết 8 không được ủng hộ.','COVID has a positive coefficient, contrary to the expected negative sign: hypothesis 8 is not supported.']]});
S({ch:4,sc:'strip',st:{band:true},k:['4.2 · Về COVID-19','4.2 · On COVID-19'],t:['Năm đại dịch, biên lãi lại cao hơn','In the pandemic years margins were higher'],
 p:[['Ba năm 2020–2022 có NIM trung bình 3,32%, cao hơn 2,99% của các năm còn lại, và sau khi kiểm soát các yếu tố khác, biến COVID có hệ số khoảng +0,20 điểm phần trăm. Một cách giải thích hợp lý là lãi suất huy động giảm nhanh hơn lãi suất cho vay khi chính sách tiền tệ nới lỏng.','The three years 2020–2022 average a NIM of 3.32%, higher than the 2.99% of other years, and after controlling for other factors the COVID variable carries a coefficient of about +0.20 percentage points. A plausible reading is that deposit rates fell faster than lending rates as monetary policy eased.'],
  ['Cần thận trọng: biến này chỉ là một biến thời gian cho ba năm, nên hấp thụ mọi cú sốc chung của giai đoạn đó, không chỉ riêng đại dịch.','Caution: the variable is a time dummy for three years, so it absorbs every common shock of the period, not only the pandemic itself.']],
 take:['Biến COVID chỉ là một biến thời gian chung, không nói riêng được cơ chế.','The COVID variable is a common time dummy and cannot isolate the mechanism.']});
/* ---- Kết luận ---- */
S({ch:5,sc:'hero',st:{end:true},k:['Kết luận','Conclusions'],t:['27 ngân hàng, một kết luận gọn','27 banks, one compact conclusion'],
 p:[['Sau khi chọn mô hình, kiểm định và sửa bằng FGLS, tại mức ý nghĩa 5% quy mô vốn chủ sở hữu, cho vay trên tiền gửi và tăng trưởng GDP tác động dương lên NIM; nợ xấu tác động âm. An toàn vốn, tỷ giá và lạm phát không có ý nghĩa. Biến đại dịch có hệ số dương.','After model selection, testing and the FGLS fix, at the 5% level equity size, loan-to-deposit and GDP growth raise NIM; bad debt lowers it. Capital adequacy, exchange rate and inflation are insignificant. The pandemic variable has a positive coefficient.']],
 take:['Vốn dày, cho vay hiệu quả, nợ xấu thấp và kinh tế tăng: bốn thứ đứng sau biên lãi cao.','Thick capital, efficient lending, low bad debt and a growing economy: the four things behind a high margin.']});
S({ch:5,sc:'clusters',st:{set:'policy'},k:['Hàm ý chính sách','Policy implications'],t:['Tăng điều tốt, kiểm soát điều xấu','Strengthen the good, contain the bad'],
 p:[['Với các yếu tố tác động tích cực: tối ưu quy mô vốn chủ sở hữu bằng giữ lại lợi nhuận và phát hành cổ phiếu có cân nhắc; duy trì cho vay trên tiền gửi hợp lý nhưng đảm bảo thanh khoản; theo dõi tăng trưởng kinh tế để mở rộng tín dụng.','For the positive factors: optimise equity by retaining earnings and issuing shares with care; keep a sensible loan-to-deposit ratio without sacrificing liquidity; track economic growth to expand credit.'],
  ['Với các yếu tố bất lợi: giảm nợ xấu bằng thẩm định tín dụng tốt hơn và tái cấu trúc khoản vay khó khăn; xây dựng hệ thống quản trị rủi ro toàn diện, có kịch bản ứng phó khi cú sốc xảy ra.','For the adverse factors: cut bad debt through better credit appraisal and restructuring of troubled loans; build a comprehensive risk-management system with scenarios for shocks.']]});
S({ch:5,sc:'clusters',st:{set:'limits'},k:['Hạn chế','Limitations'],t:['Bốn giới hạn của đề tài','Four limits of the study'],
 p:[['Dữ liệu công khai thiếu và đến từ nhiều nguồn nên có thể không đồng nhất. Mẫu chỉ gồm 27 trong 33 ngân hàng TMCP, loại trừ ngân hàng nước ngoài và liên doanh. Các yếu tố vĩ mô như chính sách và biến cố lớn chưa được phân tích sâu, và tác động của COVID-19 chưa được đo đầy đủ do thiếu dữ liệu lịch sử dài hạn.','Public data are scarce and come from many sources, so they may be inconsistent. The sample covers only 27 of 33 joint-stock banks, excluding foreign and joint-venture ones. Macro factors such as policy and major events are not analysed in depth, and the pandemic effect is not fully measured for lack of long historical data.']]});
S({ch:5,sc:'clusters',st:{set:'next'},k:['Hướng đi tiếp','Next steps'],t:['Mở rộng, làm sạch, làm giàu và hiện đại hoá','Widen, clean, enrich and modernise'],
 p:[['Hướng tiếp theo là mở rộng phạm vi và thời gian nghiên cứu ra toàn hệ thống, kể cả so sánh quốc tế; tăng độ chính xác dữ liệu bằng nguồn đáng tin cậy; thêm chính sách tiền tệ, địa chính trị và biến động toàn cầu; và dùng phương pháp hiện đại như Big Data, trí tuệ nhân tạo và mô hình phi tuyến.','Next: widen scope and time to the whole system, with international comparison; raise data accuracy with reliable sources; add monetary policy, geopolitics and global swings; and use modern methods such as Big Data, AI and non-linear models.']]});
/* ===== v2: lớp học thuật bám luận văn, các điểm nghi vấn gắn cờ VF ===== */
(function(){
const set=(i,o)=>Object.assign(STEPS[i],o);
set(0,{p:[['Mỗi ô vuông là một quan sát: một ngân hàng trong một năm. 27 ngân hàng thương mại cổ phần Việt Nam, 11 năm từ 2013 đến 2023, tổng cộng 297 ô. Màu càng đỏ, NIM càng cao (thang theo phân vị).','Each square is one observation: one bank in one year. 27 Vietnamese joint-stock commercial banks over 11 years, 2013 to 2023, 297 squares in all. The redder, the higher the NIM (quantile scale).'],['Cuộn xuống để đi qua cả khoá luận, từ lý do chọn đề tài đến kết luận. Đồng hồ trên đầu trang đếm năm theo tiến độ đọc.','Scroll down to follow the whole thesis, from rationale to conclusion. The clock at the top counts years as you read.']]});
set(2,{p:[STEPS[2].p[0],STEPS[2].p[1]]});
set(12,{p:[STEPS[12].p[0],['Khoảng trống theo luận văn: áp dụng vào thị trường mới nổi, và tác động của COVID-19 lên NIM chưa được khai thác đầy đủ.','Gap per the thesis: application to emerging markets, and the effect of COVID-19 on NIM not yet fully explored.']]});
set(16,{p:[['Tỷ giá USD/VND, lạm phát và tăng trưởng GDP chỉ đổi theo năm, không đổi theo ngân hàng, nên mỗi hàng của ma trận cùng một màu. COVID19 là biến giả cho giai đoạn 2020–2022; Stata mã Có = 1, Không = 2 nên luận văn in dấu ngược (xem VF-1).','USD/VND, inflation and GDP growth vary by year only, so each row of the matrix has one colour. COVID19 is a dummy for 2020–2022; Stata coded Yes = 1, No = 2, so the thesis prints the reversed sign (see VF-1).']]});
set(18,{p:[['Luận văn dùng kiểm định F, Breusch–Pagan LM và Hausman để chọn giữa Pooled OLS, FEM và REM. Sau đó mô hình được kiểm tra đa cộng tuyến (VIF), phương sai sai số thay đổi và tự tương quan. Nếu có vi phạm, dùng FGLS.','The thesis uses the F, Breusch–Pagan LM and Hausman tests to choose among Pooled OLS, FEM and REM. The model is then checked for multicollinearity (VIF), heteroskedasticity and autocorrelation. If violated, FGLS is used.'],['Đồ thị cho thấy p-value của từng kiểm định: thanh càng ngắn, p càng nhỏ.','The chart shows each test p-value: the shorter the bar, the smaller p.']]});
set(21,{t:['Vốn chủ sở hữu và NIM đi cùng chiều','Equity and NIM move together'],p:[['Mỗi chấm là một quan sát; đường đen là hồi quy đơn biến. NIM có xu hướng tăng khi CAP tăng (hệ số tương quan 0,42).','Each dot is one observation; the black line is a univariate fit. NIM tends to rise with CAP (correlation 0.42).']]});
set(22,{t:['LDR có tương quan mạnh nhất với NIM','LDR correlates most with NIM'],p:[['Cho vay trên tiền gửi có tương quan dương mạnh nhất với NIM (0,50) trong ma trận tương quan.','Loans-to-deposits has the strongest positive correlation with NIM (0.50) in the matrix.']]});
set(23,{t:['Nợ xấu: tác động âm chỉ rõ khi kiểm soát biến khác','Bad debt: negative only once others are controlled'],p:[['Trong đồ thị đơn biến quan hệ yếu; tác động âm xuất hiện trong FEM, REM và FGLS khi kiểm soát các biến còn lại.','The univariate plot shows a weak link; the negative effect appears in FEM, REM and FGLS once other variables are controlled.']]});
set(24,{p:[STEPS[24].p[0],['Hệ số COVID19 dương: +0,187 (FEM) và +0,185 (REM), có ý nghĩa ở mức 10%. Luận văn in dấu âm vì Stata mã Có = 1, Không = 2; đã đối chiếu lại với dữ liệu (VF-1).','The COVID19 coefficient is positive: +0.187 (FEM) and +0.185 (REM), significant at 10%. The thesis prints it negative because Stata coded Yes = 1, No = 2; re-checked against the data (VF-1).']]});
set(25,{t:['REM được chọn, còn hai vi phạm','REM is chosen, two violations remain'],p:[['Kiểm định F và Breusch–Pagan có p < 0,0001 (vai trò kiểm định F: VF-5). Hausman có p = 0,697 nên không bác bỏ giả thuyết hiệu ứng ngẫu nhiên: chọn REM. Mean VIF 1,59 dưới 2.','F and Breusch–Pagan give p < 0.0001 (role of the F-test: VF-5). Hausman gives p = 0.697, so random effects is not rejected: REM is chosen. Mean VIF 1.59 is below 2.'],['Phương sai sai số thay đổi (p < 0,0001) và tự tương quan (p = 0,0009) đều có vi phạm; luận văn chuyển sang FGLS. Tên hai kiểm định này không được nêu (VF-6).','Heteroskedasticity (p < 0.0001) and autocorrelation (p = 0.0009) are both violated; the thesis moves to FGLS. The two tests are not named (VF-6).']]});
set(26,{p:[['FGLS xử lý phương sai sai số thay đổi và tự tương quan; luận văn không nêu tuỳ chọn ước lượng (VF-4). Tại mức 5%: CAP, LDR, GDP dương; NPL âm; COVID19 dương (+0,201); CAR, tỷ giá, lạm phát không có ý nghĩa.','FGLS handles heteroskedasticity and autocorrelation; the thesis does not state its estimator options (VF-4). At 5%: CAP, LDR, GDP positive; NPL negative; COVID19 positive (+0.201); CAR, exchange rate, inflation not significant.']]});
set(27,{p:[['Hệ số được chuẩn hoá bằng độ lệch chuẩn (β*, do người trình bày tính, VF-11). CAP mạnh nhất (≈ 0,27), rồi LDR (0,17) và NPL (−0,10); GDP (0,05) và COVID19 (+0,07) nhỏ hơn; CAR, tỷ giá, lạm phát không có ý nghĩa.','Coefficients are standardised by standard deviation (β*, computed by the presenter, VF-11). CAP is strongest (≈ 0.27), then LDR (0.17) and NPL (−0.10); GDP (0.05) and COVID19 (+0.07) are smaller; CAR, exchange rate, inflation are not significant.']]});
set(28,{t:['Bốn giả thuyết được ủng hộ, ba không có ý nghĩa, một trái kỳ vọng','Four hypotheses supported, three not significant, one against expectation'],p:[['Luận văn chấp nhận H2 (CAP), H3 (LDR), H4 (NPL), H7 (GDP) và H8 (COVID19). Sau khi sửa dấu COVID19, H8 không còn được ủng hộ; CAR, tỷ giá và lạm phát không có ý nghĩa ở mức 5%.','The thesis accepts H2 (CAP), H3 (LDR), H4 (NPL), H7 (GDP) and H8 (COVID19). With the COVID19 sign corrected, H8 is no longer supported; CAR, exchange rate and inflation are not significant at 5%.'],['H8 kỳ vọng dấu âm, nhưng hệ số đúng là dương và có ý nghĩa: hợp với thống kê mô tả (NIM năm COVID cao hơn). Đã đối chiếu lại với dữ liệu (VF-1).','H8 expects a negative sign, but the correct coefficient is positive and significant, consistent with the descriptives (NIM higher in COVID years). Re-checked against the data (VF-1).']]});
set(29,{t:['Năm COVID: NIM không giảm mà tăng','COVID years: NIM rose, it did not fall'],p:[['Ba năm 2020–2022 có NIM trung bình 3,32%, cao hơn 2,99% của các năm còn lại. Sau khi kiểm soát các yếu tố khác, hệ số COVID19 là +0,201 (FGLS), có ý nghĩa ở mức 1%.','The three years 2020–2022 average NIM 3.32% against 2.99% in other years. After controlling for other factors the COVID19 coefficient is +0.201 (FGLS), significant at 1%.'],['Luận văn in dấu âm vì Stata mã hoá Có = 1, Không = 2 (thứ tự chữ cái). Mã lại Có = 1, Không = 0 cho đúng dấu dương; mọi hệ số khác và mọi p-value không đổi.','The thesis prints a negative sign because Stata coded Yes = 1, No = 2 (alphabetical order). Recoding Yes = 1, No = 0 gives the positive sign; every other coefficient and p-value is unchanged.']],take:['COVID-19 đi cùng NIM cao hơn, không thấp hơn.','COVID-19 goes with higher NIM, not lower.']});
set(30,{p:[['Sau khi chọn mô hình, kiểm định và sửa bằng FGLS, tại mức 5% quy mô vốn chủ sở hữu, cho vay trên tiền gửi và tăng trưởng GDP có hệ số dương; nợ xấu âm. An toàn vốn, tỷ giá và lạm phát không có ý nghĩa. COVID19 có ý nghĩa với hệ số dương (+0,201).','After model selection, tests and the FGLS correction, at 5% equity, loans-to-deposits and GDP growth have positive coefficients; bad debt is negative. Capital adequacy, exchange rate and inflation are not significant. COVID19 is significant with a positive coefficient (+0.201).']],take:['CAP, LDR, GDP dương · NPL âm, theo kết quả FGLS của luận văn.','CAP, LDR, GDP positive · NPL negative, per the thesis FGLS results.']});

(function(){
const FX={hero:{mode:'rad',span:520,spring:1,breathe:.3,drift:1.6},hist:{mode:'x',span:360,spring:.6},strip:{mode:'y',span:420,spring:.8},factors:{mode:'rnd',span:420,spring:1},skyline:{mode:'x',span:520,spring:.4},clusters:{mode:'ang',span:480,spring:1,breathe:.3},ctg:{mode:'-x',span:380},phases:{mode:'rad',span:420,spring:.8},flow:{mode:'x',span:380,spring:.8},panel:{mode:'diag',span:520,spring:.5},vars:{mode:'diag',span:300},models:{mode:'rnd',span:360,spring:.7},scatter:{mode:'rnd',span:460,spring:1},desc:{mode:'-x',span:360,spring:.6},corr:{mode:'rad',span:420,spring:.7},forest:{mode:'y',span:300,spring:.5},rank:{mode:'y',span:360,spring:.9},tests:{mode:'y',span:300,spring:.4},hyp:{mode:'y',span:360,spring:.7},verdict:{mode:'y',span:360,spring:.7},lit:{mode:'x',span:360,spring:.7}};

let cur=-1,rect={l:0,t:0,w:300,h:300},mobile=false;
const ctl=$('#ctl'),lbl=$('#lbl'),pan=$('#pan'),ov=$('#ov'),colEl=$('#col');
const katexTo=(el,tex)=>{try{katex.render(tex,el,{displayMode:true,throwOnError:false})}catch(e){el.textContent=tex}};
/* ---- hình học sân khấu ---- */
const LAYS={A:{s:'L',sw:.62,sh:1,va:0},B:{s:'R',sw:.62,sh:1,va:0},C:{s:'L',sw:.70,sh:1,va:0},D:{s:'R',sw:.50,sh:.80,va:1},E:{s:'L',sw:.55,sh:.78,va:.5},F:{s:'R',sw:.68,sh:1,va:0},G:{s:'L',sw:.48,sh:.84,va:0},H:{s:'R',sw:.58,sh:.86,va:.5}};
const layOf=i=>LAYS[STEPS[i].lay||'A'];
function geom(){
  VW=innerWidth;VH=innerHeight;mobile=VW<=900;const hh=mobile?50:56;
  if(!mobile){const Ly=layOf(Math.max(0,cur)),full=VH-hh-16-24,w=Math.round(Ly.sw*VW),h=Math.round(full*Ly.sh);
    rect={l:Ly.s==='L'?24:VW-24-w,t:hh+16+Math.round((full-h)*Ly.va),w,h};
    const cw=Math.min(520,VW-w-24*4);
    pan.style.left=rect.l+'px';pan.style.top=rect.t+'px';pan.style.width=rect.w+'px';pan.style.height=rect.h+'px';pan.dataset.side=Ly.s;colEl.style.paddingTop='0px';

}

function tidy(){
  const pr=lbl.getBoundingClientRect();
  $$('.t',lbl).forEach(el=>{const r=el.getBoundingClientRect();if(!r.width)return;let dx=0,dy=0;
    if(r.left<pr.left+2)dx=pr.left+2-r.left;else if(r.right>pr.right-2)dx=pr.right-2-r.right;
    if(r.top<pr.top)dy=pr.top-r.top;else if(r.bottom>pr.bottom)dy=pr.bottom-r.bottom;
    if(dx)el.style.left=(parseFloat(el.style.left)+dx)+'px';if(dy)el.style.top=(parseFloat(el.style.top)+dy)+'px'})}
function countUps(){
  $$('[data-n]',lbl).forEach(el=>{const n=+el.dataset.n,d=+(el.dataset.d||0),suf=el.dataset.s||'';const fin=()=>{el.textContent=fn(n,d)+suf};
    if(RED){fin();return}
    const par=el.closest('.t'),dl=par?parseFloat(par.style.animationDelay)||0:0;el.textContent=fn(0,d)+suf;
    const t0=performance.now()+dl,T=900;const step=t=>{const k=clamp((t-t0)/T,0,1);if(!el.isConnected)return;el.textContent=fn(n*(1-Math.pow(1-k,3)),d)+suf;if(k<1)requestAnimationFrame(step);else fin()};requestAnimationFrame(step)})}
function render(o={}){
  if(cur<0)return;const s=STEPS[cur],sc=SC[s.sc],st=ST[cur];
  if(!o.keepCtl){const keep=o.same?$$('.chips',ctl).map(c=>c.scrollLeft):[];ctl.innerHTML=sc.ctl(st)||'';$$('.chips',ctl).forEach((c,k)=>{if(keep[k])c.scrollLeft=keep[k]})}
  let ch=ctl.innerHTML?ctl.offsetHeight+4:0;lbl.style.top=ch+'px';
  const R={w:rect.w,h:rect.h-ch};const r=sc.calc(st,R);Object.assign(r.T,FX[s.sc]||{},CHFX[s.ch]||{},s.fx||{});
  applyT(r.T,rect.l,rect.t+ch,!!o.instant);
  lbl.classList.toggle('nf',!!o.nf);
  lbl.innerHTML='<svg>'+(r.s||'')+'</svg>'+(r.h||'');
  tidy();if(!o.nf)countUps();
}
